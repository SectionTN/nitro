plugins {
  id 'com.android.library' version '8.12.0'
  id 'org.jetbrains.kotlin.android' version '2.1.21'
}

def generatedRoot = file('../nitrogen/generated')

android {
  namespace 'com.margelo.nitro.test'
  compileSdk providers.gradleProperty('nitroTestCompileSdk').get().toInteger()
  ndkVersion providers.gradleProperty('nitroTestNdkVersion').get()

  defaultConfig {
    minSdk providers.gradleProperty('nitroTestMinSdk').get().toInteger()
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    ndk { abiFilters providers.gradleProperty('nitroTestAbi').get() }
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        targets 'NitroRuntimeTests'
      }
    }
  }

  buildFeatures { prefab true }
  packaging { jniLibs { pickFirsts += ['**/libc++_shared.so', '**/libfbjni.so'] } }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
      version providers.gradleProperty('nitroTestCmakeVersion').get()
    }
  }

  sourceSets {
    main {
      java.srcDirs += [
        new File(generatedRoot, 'android/kotlin'),
      ]
    }
    androidTest { assets.srcDir '../build' }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation project(':hermes')
  implementation project(':nitro-core')

  androidTestImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
