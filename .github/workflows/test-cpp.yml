name: Test C++

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-cpp.yml"
      - "packages/react-native-nitro-modules/cpp/**"
      - "scripts/test-cpp.sh"
      - "tests/cpp/**"
  pull_request:
    paths:
      - ".github/workflows/test-cpp.yml"
      - "packages/react-native-nitro-modules/cpp/**"
      - "scripts/test-cpp.sh"
      - "tests/cpp/**"

permissions:
  contents: read

jobs:
  test:
    name: Native reference lifetime (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-cpp.sh
