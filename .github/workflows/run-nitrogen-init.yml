name: Test Nitrogen init command

on:
  push:
    branches:
      - main
      - core-split
    paths:
      - '.github/workflows/run-nitrogen-init.yml'
      - 'bun.lock'
      - '**/package.json'
      - 'nitrogen/**'
  pull_request:
    paths:
      - '.github/workflows/run-nitrogen-init.yml'
      - 'bun.lock'
      - '**/package.json'
      - 'nitrogen/**'

jobs:
  lint:
    name: Run Nitrogen init command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Run nitrogen init outside the checkout
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/nitrogen/lib/index.js" init react-native-math
