name: Check release tooling

on:
  push:
    branches: [main, v1]
    paths:
      [
        'scripts/releases/**',
        'scripts/package.json',
        'scripts/set-version.mjs',
        'scripts/sync-core*.mjs',
        'scripts/core-package.mjs',
        'package.json',
        'bun.lock',
        'packages/**/package.json',
        'tests/react-native/**/package.json',
        'packages/nitro-core/js/src/version.ts',
        'packages/nitro-core/native/cpp/include/NitroModules/NitroDefines.hpp',
        '.github/workflows/*release.yml',
      ]
  pull_request:
    paths:
      [
        'scripts/releases/**',
        'scripts/package.json',
        'scripts/set-version.mjs',
        'scripts/sync-core*.mjs',
        'scripts/core-package.mjs',
        'package.json',
        'bun.lock',
        'packages/**/package.json',
        'tests/react-native/**/package.json',
        'packages/nitro-core/js/src/version.ts',
        'packages/nitro-core/native/cpp/include/NitroModules/NitroDefines.hpp',
        '.github/workflows/*release.yml',
      ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun test:release && bun test:staging
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          # queue:max is supported by GitHub; actionlint 1.7.12 predates it.
          args: -color -ignore unexpected.key..queue..for..concurrency..section .github/workflows/release.yml .github/workflows/check-release.yml
