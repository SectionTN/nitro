name: Check release tooling

on:
  push:
    branches: [main, core-split]
    paths:
      [
        'scripts/releases/**',
        'scripts/release.sh',
        'scripts/set-version.mjs',
        '.github/workflows/*release.yml',
      ]
  pull_request:
    paths:
      [
        'scripts/releases/**',
        'scripts/release.sh',
        'scripts/set-version.mjs',
        '.github/workflows/*release.yml',
      ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/releases/lib.test.mjs
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/release.yml .github/workflows/check-release.yml
