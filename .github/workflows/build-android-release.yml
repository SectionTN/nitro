name: Build React Native Android (Release)

on:
  workflow_call:
    inputs:
      release-tag:
        description: Published tag to build and attach app artifacts to
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-android-release.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

jobs:
  build_release:
    name: Build Android Example App (release, new architecture)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v1' }}
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-release
          max-size: 256M
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - name: Run Gradle Build for tests/react-native/apps/example/android/
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Upload APK to Release
        if: inputs.release-tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          ASSET_NAME="NitroExample-${RELEASE_TAG}.apk"
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq -- "$ASSET_NAME"; then
            echo "Release asset $ASSET_NAME already exists; keeping it."
          else
            mv tests/react-native/apps/example/android/app/build/outputs/apk/release/app-release.apk "$ASSET_NAME"
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          fi
