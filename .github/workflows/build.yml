name: Build shared sources and Nitrogen

on:
  push:
    branches: [main, core-split]
    paths:
      - '.github/workflows/build.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'config/**'
      - 'scripts/set-version.mjs'
      - 'scripts/releases/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'config/**'
      - 'scripts/set-version.mjs'
      - 'scripts/releases/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun typecheck
      - name: Pack Nitro core
        working-directory: packages/nitro-core
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Pack Nitrogen
        working-directory: packages/nitrogen
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install packed packages outside the workspace
        run: |
          mkdir "$RUNNER_TEMP/nitro-package-consumer"
          cd "$RUNNER_TEMP/nitro-package-consumer"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/nitro-core-*.tgz "$RUNNER_TEMP"/nitrogen-*.tgz
          test ! -e node_modules/react-native
          test ! -e node_modules/react-native-nitro-modules
          test -f node_modules/nitro-core/native/cpp/utils/NitroDefines.hpp
          test -f node_modules/nitro-core/native/apple/core/HybridObject.swift
          test -f node_modules/nitro-core/native/android/src/main/java/com/margelo/nitro/core/HybridObject.kt
          test -f node_modules/nitro-core/js/src/HybridObject.ts
          test -f node_modules/nitro-core/js/lib/module/index.js
          node --input-type=module -e "import { getInstalledNitro } from 'nitro-core'; if (getInstalledNitro() !== undefined) throw new Error('Unexpected native runtime')"
          node -e "const core = require('nitro-core'); if (core.getInstalledNitro() !== undefined) throw new Error('Unexpected native runtime')"
          node node_modules/nitrogen/lib/index.js --help
