name: Lint TypeScript

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - core-split
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - 'bun.lock'
      - '**/package.json'
  pull_request:
    paths:
      - '.github/workflows/lint-typescript.yml'
      - 'config/**'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.json'
      - 'bun.lock'
      - '**/package.json'

jobs:
  tsc:
    name: Compile TypeScript (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Run TypeScript (tsc)
        run: bun typecheck

  lint:
    name: Lint TypeScript (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Run ESLint CI in packages/nitrogen
        working-directory: packages/nitrogen
        run: bun lint-ci
      - name: Run ESLint CI in packages/nitro-core
        working-directory: packages/nitro-core
        run: bun lint-ci

      - name: Run ESLint with auto-fix in packages/nitrogen
        working-directory: packages/nitrogen
        run: bun lint
      - name: Run ESLint with auto-fix in packages/nitro-core
        working-directory: packages/nitro-core
        run: bun lint

      - name: Verify no files have changed after auto-fix
        run: git diff --exit-code HEAD -- . ':(exclude)bun.lock'
