name: Release Nitro

on:
  push:
    branches: [main, v1]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version, for example 0.37.2 or 1.0.0-alpha.1'
        required: true
        type: string
      npm-tag:
        description: 'Optional npm tag (defaults to latest, beta, rc, etc.)'
        required: false
        type: string
      dry-run:
        description: 'Build and validate without committing or publishing'
        default: false
        type: boolean

concurrency:
  group: nitro-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'margelo/nitro' && !github.event.deleted && (github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1')
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build, validate and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event_name == 'release' && (startsWith(github.event.release.tag_name, 'v1.') && contains(github.event.release.tag_name, '-alpha.') && 'v1' || 'main') || github.ref_name }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'nightly' || 'manual' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NPM_TAG: ${{ inputs.npm-tag }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: bun release:ci

  # Releases created with GITHUB_TOKEN do not trigger other release workflows.
  ios-artifacts:
    needs: release
    if: needs.release.outputs.tag != '' && github.event_name != 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/build-ios-release.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}

  android-artifacts:
    needs: release
    if: needs.release.outputs.tag != '' && github.event_name != 'release'
    permissions:
      contents: write
    uses: ./.github/workflows/build-android-release.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}
