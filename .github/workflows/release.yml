name: Release Nitro

on:
  push:
    branches: [main, 'release-request/**']
  workflow_dispatch:
    inputs:
      source-branch:
        description: 'Branch to release (use core-split until the split is merged)'
        default: main
        type: choice
        options: [main, core-split]
      version:
        description: 'Exact version, for example 0.37.2 or 0.38.0-beta.1'
        required: true
        type: string
      npm-tag:
        description: 'Optional npm tag (defaults to latest, beta, rc, etc.)'
        required: false
        type: string
      dry-run:
        description: 'Build and validate without committing or publishing'
        default: false
        type: boolean

concurrency:
  group: nitro-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'margelo/nitro' && !github.event.deleted && (github.ref == 'refs/heads/core-split' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-request/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source-branch || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Build, validate and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.source-branch || 'main' }}
          RELEASE_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'nightly' || 'manual' }}
          RELEASE_REQUEST_REF: ${{ startsWith(github.ref, 'refs/heads/release-request/') && github.ref_name || '' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NPM_TAG: ${{ inputs.npm-tag }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: node scripts/releases/core.mjs

  notify-react-native:
    needs: release
    if: needs.release.outputs.tag != '' && vars.NITRO_PERFORMANCE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Keep the app's private key out of the job that runs package build scripts.
      - name: Create downstream workflow token
        id: downstream-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.NITRO_PERFORMANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.NITRO_PERFORMANCE_APP_PRIVATE_KEY }}
          owner: margelo
          repositories: react-native-nitro-modules
          permission-actions: write
      - name: Start the matching React Native release
        env:
          GH_TOKEN: ${{ steps.downstream-token.outputs.token }}
          CORE_TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run release.yml --repo margelo/react-native-nitro-modules --ref main -f "core-tag=$CORE_TAG"
