name: Release Nitro

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: 'Branch to release (use core-split until the split is merged)'
        default: core-split
        type: choice
        options: [core-split, main]
      version:
        description: 'Exact version, for example 0.37.2 or 0.38.0-beta.1'
        required: true
        type: string
      npm-tag:
        description: 'Optional npm tag (defaults to latest, beta, rc, etc.)'
        required: false
        type: string
      dry-run:
        description: 'Build and validate without committing or publishing'
        default: false
        type: boolean

concurrency:
  group: nitro-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'margelo/nitro' && (github.ref == 'refs/heads/core-split' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Build, validate and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ inputs.source-branch }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NPM_TAG: ${{ inputs.npm-tag }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: node scripts/releases/core.mjs
