name: Harness Android

concurrency:
  group: harness-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_dispatch:
    inputs:
      device_api_level:
        description: "Override the Android API level for both jobs"
        required: false
        type: string
      device_profile:
        description: "Device profile"
        required: false
        default: "pixel_7"
        type: string
      avd_name:
        description: "Override the AVD name for both jobs"
        required: false
        type: string
  push:
    branches:
      - main
      - core-split
    paths:
      - '.github/workflows/harness-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'
  pull_request:
    paths:
      - '.github/workflows/harness-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  DEVICE_ARCH: x86_64
  DEVICE_PROFILE: ${{ github.event.inputs.device_profile || 'pixel_7' }}
  AVD_DISK_SIZE: 1G
  AVD_HEAP_SIZE: 1G

jobs:
  harness_android_new:
    name: Harness Android (${{ matrix.sanitizer.name }}, new architecture)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        min-sdk:
          - '26'
        sanitizer:
          - name: Default
            gradle_property: ""
            device_api_level: "36"
            avd_name: Pixel_7_API_36
          - name: ASan
            gradle_property: "address"
            # Keep legacy x86_64 ASan on the API 33 image verified in #1530.
            # HWASan requires ARM64; this workflow uses an x86_64 emulator.
            device_api_level: "33"
            avd_name: Pixel_7_API_33
    env:
      DEVICE_API_LEVEL: ${{ github.event.inputs.device_api_level || matrix.sanitizer.device_api_level }}
      AVD_NAME: ${{ github.event.inputs.avd_name || matrix.sanitizer.avd_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Reclaim disk space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate React Native test bindings
        run: bun specs

      - name: Set minSdk in build.gradle
        run: sed -i "s/minSdkVersion = 24/minSdkVersion = ${{ matrix.min-sdk }}/g" tests/react-native/apps/example/android/build.gradle

      - name: Setup JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "zulu"
          java-version: 17
          java-package: jdk

      - name: Restore Gradle/CMake cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/react-native/apps/example/android/.gradle
            tests/react-native/apps/example/android/app/.cxx
          key: ${{ runner.os }}-gradle-${{ matrix.min-sdk }}-${{ env.DEVICE_ARCH }}-${{ matrix.sanitizer.name }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.min-sdk }}-${{ env.DEVICE_ARCH }}-${{ matrix.sanitizer.name }}-
            ${{ runner.os }}-gradle-
      - name: Build React Native Android app
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew :app:assembleDebug --no-daemon --build-cache -PreactNativeArchitectures=${{ env.DEVICE_ARCH }} -PnitroSanitizer=${{ matrix.sanitizer.gradle_property }}

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: android
          projectRoot: tests/react-native/apps/example
          app: android/app/build/outputs/apk/debug/app-debug.apk
          packageManager: bun

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          [ -d .harness/crash-reports ] || exit 0
          find .harness/crash-reports -type f | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done

      # Gradle cache doesn't like daemons
      - name: Stop Gradle Daemon
        working-directory: tests/react-native/apps/example/android
        run: ./gradlew --stop
