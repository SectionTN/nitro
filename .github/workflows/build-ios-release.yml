name: Build iOS (Release)

on:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-ios-release.yml'

jobs:
  build_release:
    name: Build iOS Example App (release, new architecture)
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2

      - name: Install npm dependencies (bun)
        run: bun install

      - name: Select Xcode 26.5
        run: sudo xcode-select -s "/Applications/Xcode_26.5.app/Contents/Developer"
      - name: Set up Swift Package Manager
        working-directory: apps/example
        run: bunx react-native spm update --yes

      - name: Build App (Release, Simulator)
        working-directory: apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            -derivedDataPath DerivedData -UseModernBuildSystem=YES \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            clean \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Package .app for Simulator
        run: |
          cd apps/example/ios/DerivedData/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/NitroExample-Release-Simulator.zip" NitroExample.app

      - name: Upload .app to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          ASSET_NAME="NitroExample-Simulator-${RELEASE_TAG}.app.zip"
          mv NitroExample-Release-Simulator.zip "$ASSET_NAME"
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
