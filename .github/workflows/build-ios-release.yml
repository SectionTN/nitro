name: Build React Native iOS (Release)

on:
  workflow_call:
    inputs:
      release-tag:
        description: Published tag to build and attach app artifacts to
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-ios-release.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

jobs:
  build_release:
    name: Build iOS Example App (release, new architecture)
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Generate test bindings
        run: bun specs

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Read native build cache inputs
        id: native
        run: |
          toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Restore React Native and Hermes downloads
        id: downloads-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Restore compilation cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tests/react-native/apps/example/ios/build/CompilationCache.noindex
            tests/react-native/apps/example/ios/build/SourcePackages
          key:
            react-native-ios-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.toolchain }}-${{ inputs.release-tag ||
            github.sha }}
          restore-keys: |
            react-native-ios-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native.outputs.toolchain }}-

      - name: Resolve Swift packages
        working-directory: tests/react-native/apps/example
        run: bun spm

      - name: Save React Native and Hermes downloads
        if: >-
          steps.downloads-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v1')
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ steps.downloads-cache.outputs.cache-primary-key }}

      - name: Build App (Release, Simulator)
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_LIMIT_SIZE=512M \
            -derivedDataPath build \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Save compilation cache
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/v1')
        uses: actions/cache/save@v6
        with:
          path: |
            tests/react-native/apps/example/ios/build/CompilationCache.noindex
            tests/react-native/apps/example/ios/build/SourcePackages
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Package .app for Simulator
        run: |
          cd tests/react-native/apps/example/ios/build/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/NitroExample-Release-Simulator.zip" NitroExample.app

      - name: Upload .app to Release
        if: inputs.release-tag != '' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          ASSET_NAME="NitroExample-Simulator-${RELEASE_TAG}.app.zip"
          EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq -- "$ASSET_NAME"; then
            echo "Release asset $ASSET_NAME already exists; keeping it."
          else
            mv NitroExample-Release-Simulator.zip "$ASSET_NAME"
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          fi
