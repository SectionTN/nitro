name: Test standalone runtime (Android)

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/test-runtime-android.yml'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'tests/standalone/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'
      - 'scripts/set-version.mjs'
      - '.gitmodules'

permissions:
  contents: read

concurrency:
  group:
    runtime-android-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_name != 'main' && github.ref ||
    github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  junit:
    name: Standalone Android (${{ matrix.sanitizer.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: Default
            flag: ''
            api-level: 36
          - name: ASan
            flag: address
            api-level: 33
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v1' }}
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: android-standalone-${{ matrix.sanitizer.name }}
          max-size: 512M
          save: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1' }}
      - name: Read Hermes build cache inputs
        id: hermes
        run: |
          echo "revision=$(git -C tests/standalone/hermes/hermes rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(cc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Hermes host compiler
        id: hermes-cache
        uses: actions/cache/restore@v6
        with:
          path: tests/standalone/.build/hermes/host
          key:
            hermes-host-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.hermes.outputs.compiler }}-${{ steps.hermes.outputs.revision }}-${{
            hashFiles('tests/standalone/hermes/build.mjs', 'tests/standalone/hermes/options.cmake') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test:prepare
      - name: Build JUnit Test Runner
        working-directory: tests/standalone/test-runner/android
        run: ./gradlew :assembleDebugAndroidTest -PnitroTestAbi=x86_64 -PnitroSanitizer=${{ matrix.sanitizer.flag }} --build-cache
      - name: Save Hermes host compiler
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v1') && steps.hermes-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: tests/standalone/.build/hermes/host
          key: ${{ steps.hermes-cache.outputs.cache-primary-key }}
      - name: Run JUnit Test Suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sanitizer.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script:
            cd tests/standalone/test-runner/android && ./gradlew :connectedDebugAndroidTest -PnitroTestAbi=x86_64 -PnitroSanitizer=${{
            matrix.sanitizer.flag }} --build-cache
      - name: Summarize JUnit results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = Path('tests/standalone/test-runner/android/build/outputs/androidTest-results/connected').rglob('TEST-*.xml')
          cases = [case for report in sorted(reports) for case in ET.parse(report).getroot().iter('testcase')]
          lines = []
          passed = failed = skipped = 0
          for case in cases:
              name = f"{case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name', '')}"
              failure = case.find('failure')
              if failure is None:
                  failure = case.find('error')
              if failure is not None:
                  failed += 1
                  lines.append(f'✗ {name}')
                  details = (failure.text or failure.get('message', '')).strip()
                  lines.extend(f'  {line}' for line in details.splitlines())
              elif case.find('skipped') is not None:
                  skipped += 1
                  lines.append(f'- {name} (skipped)')
              else:
                  passed += 1
                  lines.append(f'✓ {name}')
          lines.append(f'{passed} passed, {failed} failed, {skipped} skipped' if cases else 'No JUnit results were produced.')
          result = '\n'.join(lines)
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Android JUnit results\n\n```text\n{result}\n```\n')
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-android-results-${{ matrix.sanitizer.name }}
          path: |
            tests/standalone/test-runner/android/build/reports/androidTests
            tests/standalone/test-runner/android/build/outputs/androidTest-results
            tests/standalone/test-runner/build/runtime-tests.js
            tests/standalone/test-runner/build/runtime-tests.js.map
            tests/standalone/test-runner/build/runtime-tests.json
            tests/standalone/test-runner/build/runtime-test-skips.json
          if-no-files-found: ignore
